name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v2024.01.15.10)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish SingleFile profile
        run: |
          dotnet publish WmiExplorer/WmiExplorer.csproj `
            -p:PublishProfile=SingleFile `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --configuration Release

      - name: Publish MultiFile profile
        run: |
          dotnet publish WmiExplorer/WmiExplorer.csproj `
            -p:PublishProfile=MultiFile `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --configuration Release

      - name: Publish Standalone profile
        run: |
          dotnet publish WmiExplorer/WmiExplorer.csproj `
            -p:PublishProfile=Standalone `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --configuration Release

      - name: Create SingleFile zip
        run: |
          $zipName = "WmiExplorer-SingleFile-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "WmiExplorer\bin\Publish\SingleFile\*" -DestinationPath $zipName -Force
          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: zip-singlefile
        shell: pwsh

      - name: Create MultiFile zip
        run: |
          $zipName = "WmiExplorer-MultiFile-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "WmiExplorer\bin\Publish\MultiFile\*" -DestinationPath $zipName -Force
          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: zip-multifile
        shell: pwsh

      - name: Create Standalone zip
        run: |
          $zipName = "WmiExplorer-Standalone-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "WmiExplorer\bin\Publish\Standalone\*" -DestinationPath $zipName -Force
          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: zip-standalone
        shell: pwsh

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: false
          make_latest: true
          body: |
            Release ${{ steps.version.outputs.version }}

            ## Downloads

            - **SingleFile**: Framework-dependent single file deployment (Requires .NET runtime installed)
            - **MultiFile**: Framework-dependent multi-file deployment (Requires .NET runtime installed)
            - **Standalone**: Self-contained single file deployment (Does not require .NET runtime installed)

            Choose the deployment type that best fits your needs.
          files: |
            WmiExplorer-SingleFile-${{ steps.version.outputs.version }}.zip
            WmiExplorer-MultiFile-${{ steps.version.outputs.version }}.zip
            WmiExplorer-Standalone-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

