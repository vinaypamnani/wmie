name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v2024.01.15.10)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish SingleFile profile
        run: |
          dotnet publish WmiExplorer/WmiExplorer.csproj `
            -p:PublishProfile=SingleFile `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --configuration Release

      - name: Publish Standalone profile
        run: |
          dotnet publish WmiExplorer/WmiExplorer.csproj `
            -p:PublishProfile=Standalone `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --configuration Release

      - name: Create SingleFile zip
        run: |
          $zipName = "WmiExplorer-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "WmiExplorer\bin\Publish\SingleFile\*" -DestinationPath $zipName -Force
          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: zip-singlefile
        shell: pwsh

      - name: Create Standalone zip
        run: |
          $zipName = "WmiExplorer-Standalone-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "WmiExplorer\bin\Publish\Standalone\*" -DestinationPath $zipName -Force
          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: zip-standalone
        shell: pwsh

      - name: Generate release notes
        id: release-notes
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          # GitHub API will automatically determine previous_tag_name if not provided
          $body = @{
            tag_name = $tag
          } | ConvertTo-Json

          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" `
            -Method POST `
            -Headers @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -Body $body `
            -ContentType "application/json"

          $generatedNotes = $response.body
          # Normalize line endings
          $generatedNotes = $generatedNotes -replace "`r`n", "`n"

          # Write to file for reliable multiline handling
          $generatedNotes | Out-File -FilePath "release-notes-generated.txt" -Encoding utf8 -NoNewline

      - name: Combine release notes
        id: combined-notes
        shell: pwsh
        run: |
          $generatedNotes = Get-Content -Path "release-notes-generated.txt" -Raw
          $downloadsSection = "`n`n## Downloads`n`n- **WmiExplorer**: Framework-dependent single file deployment (Requires .NET runtime installed)`n- **Standalone**: Self-contained single file deployment (Does not require .NET runtime installed)"

          $combinedBody = $generatedNotes + $downloadsSection
          # Write combined body to file
          $combinedBody | Out-File -FilePath "release-notes-body.txt" -Encoding utf8 -NoNewline

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: false
          make_latest: true
          body_path: release-notes-body.txt

          files: |
            WmiExplorer-${{ steps.version.outputs.version }}.zip
            WmiExplorer-Standalone-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

